# Purpose: Defines the proposed local-only SQL Server dependency for VIVOICE development.
# Responsibility: Keeps database data in a named Docker volume and never exposes SQL Server beyond this computer.
name: vivoice-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04@sha256:ea73825f3d88a23c355ac2f9fdc6bd960fec90171c12c572109b36a558f77bb8
    container_name: vivoice-sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file before starting SQL Server.}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - vivoice_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'SQL Server is now ready for client connections' /var/opt/mssql/log/errorlog"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  vivoice_sqlserver_data:
    name: vivoice_sqlserver_data

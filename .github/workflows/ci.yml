name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test with coverage
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml

  container:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build -f src/TourGuide.Api/Dockerfile -t tourguide-api:${{ github.sha }} src/TourGuide.Api
      - name: Validate Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_PASSWORD: ci-app-password
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
        run: docker compose config --quiet

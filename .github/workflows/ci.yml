# Purpose: Validate the VIVOICE web project and its unit tests without starting the app or using production services.
name: VIVOICE CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js for frontend unit tests
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore unit-test dependencies
        run: dotnet restore tests/Vivoice.Web.Tests/Vivoice.Web.Tests.csproj

      - name: Build VIVOICE web project
        run: dotnet build src/Vivoice.Web/Vivoice.Web.csproj --configuration Release --no-restore

      - name: Run VIVOICE unit tests
        run: dotnet test tests/Vivoice.Web.Tests/Vivoice.Web.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Run frontend JavaScript syntax checks
        run: |
          node --check src/Vivoice.Web/wwwroot/public.js
          node --check src/Vivoice.Web/wwwroot/admin.js
          node --check src/Vivoice.Web/wwwroot/tts-language.js
          node --check src/Vivoice.Web/wwwroot/visitor-session.js

      - name: Run frontend unit tests
        run: node --test tests/Vivoice.Web.Tests/Frontend/*.test.cjs

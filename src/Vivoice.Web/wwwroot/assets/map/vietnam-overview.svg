<!-- Purpose: Provides a local, decorative Vietnam overview beneath Leaflet markers when network map tiles are unavailable. -->
<!-- Responsibility: Preserves spatial orientation without claiming to replace a full online street map. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1440" role="img" aria-label="Vietnam overview map fallback">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4f4"/>
      <stop offset="1" stop-color="#dbe9ea"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#eadcc0"/>
      <stop offset="1" stop-color="#d6b776"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2c1b12" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="960" height="1440" fill="url(#sea)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".54" stroke-width="2">
    <path d="M0 180H960M0 360H960M0 540H960M0 720H960M0 900H960M0 1080H960M0 1260H960"/>
    <path d="M160 0V1440M320 0V1440M480 0V1440M640 0V1440M800 0V1440"/>
  </g>
  <path d="M384 84C452 103 515 144 533 199C548 244 545 285 580 331C618 381 618 432 579 474C545 510 502 535 486 579C469 625 476 675 506 720C542 774 555 836 535 887C518 932 477 964 465 1010C450 1065 470 1124 498 1178C520 1220 513 1260 482 1306C453 1348 425 1376 406 1364C378 1347 360 1312 343 1267C321 1207 307 1148 316 1091C326 1028 365 979 379 922C394 861 384 809 354 763C320 712 292 655 300 600C308 544 346 500 369 448C391 399 386 353 351 312C315 269 297 232 315 184C331 140 349 104 384 84Z" fill="url(#land)" filter="url(#shadow)"/>
  <path d="M395 121C451 157 471 222 462 283C454 339 430 381 416 436C401 495 419 553 450 607C487 672 500 728 480 785C462 838 425 881 416 938C407 994 424 1055 451 1117C470 1161 463 1216 438 1265" fill="none" stroke="#c6a15b" stroke-width="13" stroke-linecap="round" stroke-opacity=".8"/>
  <g fill="#7a2116" font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2">
    <text x="72" y="96">VIVOICE</text>
    <text x="72" y="129" fill="#705e42" font-size="17" font-weight="600" letter-spacing="1">VIETNAM OVERVIEW</text>
  </g>
  <g fill="#705e42" font-family="system-ui, sans-serif" font-size="17" font-weight="600">
    <text x="615" y="198">Gulf of Tonkin</text>
    <text x="615" y="1115">South China Sea</text>
    <text x="72" y="1350">Local orientation fallback</text>
    <text x="72" y="1377">Online tiles may refine the view.</text>
  </g>
</svg>

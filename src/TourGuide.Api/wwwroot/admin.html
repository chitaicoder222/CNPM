<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TourGuide Admin — POI & Nội dung</title>
  <style>
    :root{--ink:#173332;--muted:#6b7d7b;--bg:#f5f7f5;--card:#fff;--line:#dfe8e2;--teal:#1f7169;--danger:#b64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1120px;margin:36px auto;padding:0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 12px 30px #1733320d}h1,h2{margin:0 0 8px;letter-spacing:-.03em}.muted{color:var(--muted);font-size:13px}input,textarea,select,button{width:100%;padding:11px;border:1px solid #ccd8d2;border-radius:10px;font:inherit;margin:5px 0}button{background:var(--teal);color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#edf4f1;color:var(--ink)}button.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0caca}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.list{max-height:620px;overflow:auto}.item{padding:13px;border-bottom:1px solid #e9eeeb;cursor:pointer}.item:hover,.item.active{background:#f1f8f5}.item strong{display:block}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8f4ef;color:var(--teal);font-size:11px;font-weight:700}.badge.off{background:#f4eeee;color:var(--danger)}.toolbar{display:flex;gap:10px;align-items:center}.toolbar button{width:auto;padding:9px 14px}.hidden{display:none!important}@media(max-width:800px){.layout,.grid{grid-template-columns:1fr}main{padding:0 14px}}
  </style>
</head>
<body><main>
  <section id="loginCard" class="card"><h1>Quản lý POI</h1><p class="muted">Khu vực Admin chỉ dành cho quản lý POI và nội dung thuyết minh.</p><input id="email" type="text" placeholder="Tài khoản Admin"><input id="password" type="password" placeholder="Mật khẩu"><button id="login">Đăng nhập</button><p id="loginStatus" class="muted"></p></section>
  <section id="app" class="hidden"><div class="card toolbar"><div style="flex:1"><h1>TourGuide Admin</h1><p id="stats" class="muted"></p></div><button id="logout" class="secondary">Đăng xuất</button></div>
    <div class="layout"><aside class="card"><div class="toolbar"><h2 style="flex:1">POI</h2><button id="newPoi">+ Mới</button></div><input id="search" placeholder="Tìm POI hoặc thành phố"><div id="list" class="list"></div></aside>
      <section><div class="card"><h2>Thông tin POI</h2><form id="poiForm"><input id="poiId" type="hidden"><div class="grid"><input id="name" required placeholder="Tên địa điểm"><input id="city" placeholder="Thành phố"><input id="category" placeholder="Loại hình"><input id="address" placeholder="Địa chỉ"><input id="lat" type="number" step="any" placeholder="Latitude"><input id="lng" type="number" step="any" placeholder="Longitude"></div><textarea id="description" rows="4" placeholder="Mô tả tiếng Việt"></textarea><label><input id="active" type="checkbox" checked style="width:auto"> Đang hiển thị công khai</label><div class="toolbar"><button>Lưu POI</button><button type="button" id="clearPoi" class="secondary">Xóa form</button></div><p id="poiStatus" class="muted"></p></form></div>
        <div class="card"><div class="toolbar"><div style="flex:1"><h2>Nội dung thuyết minh</h2><p class="muted">Tạo chủ đề thật để khách chọn và đưa vào pipeline dịch/TTS.</p></div><button id="newContent">+ Nội dung</button></div><form id="contentForm" class="hidden"><input id="contentId" type="hidden"><div class="grid"><input id="contentTitle" required placeholder="Tiêu đề"><input id="contentTopic" required placeholder="Chủ đề"><select id="contentType"><option value="topic">Chủ đề</option><option value="food">Ẩm thực</option><option value="event">Sự kiện</option><option value="hotel">Lưu trú</option></select></div><textarea id="contentText" required rows="6" placeholder="Nội dung thuyết minh tiếng Việt"></textarea><div class="toolbar"><button>Lưu nội dung</button><button type="button" id="clearContent" class="secondary">Hủy</button></div><p id="contentStatus" class="muted"></p></form><div id="contentList"></div></div>
      </section>
    </div>
  </section>
</main><script>
const api=location.origin;let token=sessionStorage.getItem('tourguide_admin_token')||'',places=[],selected=null;const $=id=>document.getElementById(id);function headers(){return{Authorization:`Bearer ${token}`}}function show(){ $('loginCard').classList.toggle('hidden',!!token);$('app').classList.toggle('hidden',!token);if(token)loadPlaces();}async function login(){const r=await fetch(`${api}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});if(!r.ok){$('loginStatus').textContent='Đăng nhập thất bại hoặc tài khoản không có quyền.';return}const d=await r.json();if(d.user?.role!=='admin'){$('loginStatus').textContent='Tài khoản không có quyền Admin.';return}token=d.token;sessionStorage.setItem('tourguide_admin_token',token);show()}async function loadPlaces(){const r=await fetch(`${api}/places?includeInactive=true`,{headers:headers()});if(r.status===401||r.status===403){token='';sessionStorage.removeItem('tourguide_admin_token');show();return}places=await r.json();renderPlaces();$('stats').textContent=`${places.length} POI · ${places.filter(x=>x.isActive).length} đang hiển thị · ${places.filter(x=>!x.isActive).length} đang ẩn`;if(selected){const fresh=places.find(x=>x.id===selected.id);if(fresh)selectPlace(fresh)} }function renderPlaces(){const q=$('search').value.toLowerCase();$('list').innerHTML='';places.filter(x=>`${x.name} ${x.city||''}`.toLowerCase().includes(q)).forEach(p=>{const row=document.createElement('div');row.className='item'+(selected?.id===p.id?' active':'');row.onclick=()=>selectPlace(p);const s=document.createElement('strong');s.textContent=p.name;const m=document.createElement('span');m.className=`badge ${p.isActive?'':'off'}`;m.textContent=p.isActive?'Đang hiển thị':'Đang ẩn';row.append(s,m);$('list').append(row)})}function selectPlace(p){selected=p;$('poiId').value=p.id;$('name').value=p.name;$('city').value=p.city||'';$('category').value=p.category||'';$('address').value=p.address||'';$('lat').value=p.latitude||'';$('lng').value=p.longitude||'';$('description').value=p.description||'';$('active').checked=p.isActive;renderPlaces();loadContents()}function clearPoi(){selected=null;$('poiForm').reset();$('poiId').value='';$('active').checked=true;renderPlaces();$('contentList').innerHTML=''}async function savePoi(e){e.preventDefault();const id=$('poiId').value;const body={name:$('name').value,city:$('city').value,category:$('category').value,address:$('address').value,latitude:$('lat').value?Number($('lat').value):null,longitude:$('lng').value?Number($('lng').value):null,description:$('description').value,isActive:$('active').checked};const r=await fetch(`${api}/places${id?`/${id}`:''}`,{method:id?'PUT':'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});$('poiStatus').textContent=r.ok?'Đã lưu POI.':'Không thể lưu POI.';if(r.ok){await loadPlaces();}}async function loadContents(){if(!selected){$('contentList').innerHTML='<p class="muted">Chọn một POI để xem nội dung.</p>';return}const r=await fetch(`${api}/places/${selected.id}/contents`);const items=await r.json();$('contentList').innerHTML='';if(!items.length){$('contentList').innerHTML='<p class="muted">POI chưa có nội dung.</p>';return}items.forEach(c=>{const row=document.createElement('div');row.className='item';const s=document.createElement('strong');s.textContent=`${c.title} · ${c.topic}`;const p=document.createElement('p');p.className='muted';p.textContent=c.sourceText;const b=document.createElement('button');b.className='secondary';b.textContent='Sửa';b.onclick=()=>fillContent(c);row.append(s,p,b);$('contentList').append(row)})}function fillContent(c){$('contentForm').classList.remove('hidden');$('contentId').value=c.id;$('contentTitle').value=c.title;$('contentTopic').value=c.topic;$('contentType').value=c.contentType;$('contentText').value=c.sourceText}function clearContent(){$('contentForm').classList.add('hidden');$('contentForm').reset();$('contentId').value=''}async function saveContent(e){e.preventDefault();if(!selected)return;$('contentStatus').textContent='Đang lưu...';const id=$('contentId').value;const body={title:$('contentTitle').value,topic:$('contentTopic').value,contentType:$('contentType').value,sourceText:$('contentText').value};const r=await fetch(`${api}/places/${selected.id}/contents${id?`/${id}`:''}`,{method:id?'PUT':'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});$('contentStatus').textContent=r.ok?'Đã lưu nội dung.':'Không thể lưu nội dung.';if(r.ok){clearContent();loadContents()}}$('login').onclick=login;$('logout').onclick=()=>{token='';sessionStorage.removeItem('tourguide_admin_token');show()};$('poiForm').onsubmit=savePoi;$('contentForm').onsubmit=saveContent;$('newPoi').onclick=clearPoi;$('newContent').onclick=()=>{$('contentForm').classList.remove('hidden');$('contentForm').reset();$('contentId').value=''};$('clearPoi').onclick=clearPoi;$('clearContent').onclick=clearContent;$('search').oninput=renderPlaces;show();
</script></body></html>
